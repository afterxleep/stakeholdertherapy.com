title: Stakeholder Therapy
description: Stakeholder Therapy has moved to danielbernal.co/blog
url: "https://stakeholdertherapy.com"
baseurl: ""

# This site is now redirect-only. Every post URL resolves to its counterpart
# under https://danielbernal.co/blog/ via jekyll-redirect-from. The content
# itself lives in the afterxleep/danielbernal.co repository.

# Author
author:
  name: Daniel Bernal
  url: https://danielbernal.co

# Social
twitter:
  username: afterxleep
  card: summary_large_image

social:
  name: Daniel Bernal
  links:
    - https://twitter.com/afterxleep
    - https://github.com/afterxleep

# SEO
lang: en_US

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - migrate_wp_to_jekyll.py
  - .git
  - .gitignore

# Include headers file
include:
  - _headers
  - robots.txt

# Plugins
# jekyll-feed and jekyll-sitemap are intentionally absent: feed.xml is now a
# hand-written "we moved" feed, and a redirect-only site should not publish a
# sitemap of dead URLs.
plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
